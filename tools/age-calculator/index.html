<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - Exact Age in Years, Months, Days - Project UT</title>
    <meta name="description" content="Free online Age Calculator. Calculate your exact age in years, months, and days, and find out how many days until your next birthday.">
    <meta name="keywords" content="age calculator, exact age, calculate age, next birthday, age in days">
    <link rel="canonical" href="https://projectut.com/tools/age-calculator/">

    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/tool.css">

    <link rel="manifest" href="manifest.json">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3565X5KNFD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3565X5KNFD');
    </script>
    <link rel="stylesheet" href="../../components/global-nav.css">
</head>
<body class="dark-theme">
    <header class="global-header-container"></header>

    <main class="container">
        <div class="tool-header">
            <h1>Age Calculator</h1>
            <p>Calculate your exact age and see how many days are left until your next birthday.</p>
        </div>

        <div class="tool-card-single">
            <div class="card">
                <div class="calculator-grid">
                    <!-- Inputs -->
                    <div class="input-section">
                        <div class="form-group">
                            <label for="dob">Date of Birth</label>
                            <input type="date" id="dob" class="w-full text-lg">
                        </div>
                        <div class="form-group" style="margin-top: 1rem;">
                            <label for="target-date">Calculate age at the date of:</label>
                            <input type="date" id="target-date" class="w-full text-lg">
                        </div>
                        <div class="button-group" style="margin-top: 1.5rem;">
                            <button id="calculate-btn" class="btn btn-primary w-full">Calculate Age</button>
                        </div>
                    </div>

                    <!-- Outputs -->
                    <div class="output-section">
                        <div class="age-result-box" id="result-box">
                            <div class="empty-state text-center" style="color: var(--text-secondary); font-style: italic;">
                                Enter your date of birth to see your exact age.
                            </div>
                        </div>

                        <div class="extra-stats" id="extra-stats" style="display: none;">
                            <div class="stat-item">
                                <span class="stat-label">Next Birthday</span>
                                <span class="stat-val" id="next-bday">--</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Total Months</span>
                                <span class="stat-val" id="total-months">--</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Total Weeks</span>
                                <span class="stat-val" id="total-weeks">--</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Total Days</span>
                                <span class="stat-val" id="total-days">--</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ad Placeholder -->
        <div class="ad-container">
            <!-- Ad will be placed here -->
        </div>
    </main>

    <footer class="global-footer-container"></footer>

    <script src="js/logic.js" type="module"></script>
    <script>
        fetch('https://api.counterapi.dev/v1/projectut_com/visits/up')
            .then(response => response.json())
            .then(data => {
                const counter = document.getElementById('dynamic-visitor-count');
                if(counter) counter.textContent = data.count;
            })
            .catch(error => console.error('Error fetching visitor count:', error));
    </script>
    <script src="../../load-components.js"></script>
</body>
</html>
