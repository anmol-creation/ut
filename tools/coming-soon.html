<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - UT.ac</title>
    <link rel="stylesheet" href="tools.css">
    <!-- Google tracking code -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3565X5KNFD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-3565X5KNFD');
    </script>
    <style>
        .coming-soon-container {
            text-align: center;
            padding: 4rem 1rem;
            max-width: 600px;
            margin: 0 auto;
        }
        .coming-soon-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        .coming-soon-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--text-color);
        }
        .coming-soon-text {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .back-button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .back-button:hover {
            background-color: var(--primary-hover);
        }
    </style>

    <link rel="manifest" href="/manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.error("Service Worker registration failed: ", err));
        });
      }
    </script>
</head>
<body>
    <header>
        <div class="logo"><a href="../index.html" style="color: inherit; text-decoration: none;">UT.ac</a></div>
        <button id="theme-toggle" aria-label="Toggle Dark/Light Mode">Toggle Theme</button>
    </header>

    <main>
        <div class="coming-soon-container">
            <div class="coming-soon-icon">🚧</div>
            <h1 class="coming-soon-title">Coming Soon</h1>
            <p class="coming-soon-text">We are working hard to bring you these new tools. Stay tuned for updates as we expand our collection of utilities.</p>
            <a href="index.html" class="back-button">Back to Tools</a>
        </div>
    </main>

    <footer>
        <p>&copy; UT.ac — All tools are free <span class="visitor-counter" style="margin-left: 15px; opacity: 0.8;">| Total Users: 3,000+</span></p>
    </footer>

    <script src="tools.js"></script>
</body>
</html>
