<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading (H1-H6) Extractor & Checker - Project UT</title>
    <meta name="description" content="Free online Heading Extractor. Paste HTML code to extract and check your H1 to H6 heading structure for SEO compliance.">
    <meta name="keywords" content="heading extractor, h1 checker, heading seo, html heading parser, seo structure checker">
    <link rel="canonical" href="https://projectut.com/tools/heading-extractor/">

    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/tool.css">

    <link rel="manifest" href="manifest.json">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3565X5KNFD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3565X5KNFD');
    </script>
    <link rel="stylesheet" href="../../components/global-nav.css">
</head>
<body class="dark-theme">
    <header class="global-header-container"></header>

    <main class="container">
        <div class="tool-header">
            <h1>Heading Extractor & Checker</h1>
            <p>Paste your HTML code to visualize and validate your page's heading hierarchy.</p>
        </div>

        <div class="split-layout">
            <!-- Left Panel: Input -->
            <div class="panel input-panel">
                <div class="card h-full flex-col">
                    <h2>HTML Input</h2>

                    <p class="help-text" style="margin-bottom: 0.5rem;">Paste the raw HTML source code of your webpage.</p>

                    <textarea id="html-input" class="w-full flex-grow" style="font-family: monospace; min-height: 300px;" placeholder="&lt;html&gt;&#10;  &lt;body&gt;&#10;    &lt;h1&gt;Main Title&lt;/h1&gt;&#10;    &lt;h2&gt;Subtitle&lt;/h2&gt;&#10;  &lt;/body&gt;&#10;&lt;/html&gt;"></textarea>

                    <div class="button-group" style="margin-top: 1rem;">
                        <button id="analyze-btn" class="btn btn-primary">Extract Headings</button>
                        <button id="clear-btn" class="btn btn-secondary">Clear</button>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Output -->
            <div class="panel output-panel">
                <div class="card h-full flex-col" style="overflow-y: auto;">
                    <h2>Heading Structure</h2>

                    <div id="seo-alerts" style="margin-top: 1rem; display: none;"></div>

                    <div id="headings-output" class="headings-container flex-grow" style="margin-top: 1rem;">
                        <div class="empty-state text-center" style="padding: 3rem 1rem; color: var(--text-secondary); font-style: italic;">
                            Extracted headings will appear here in a nested tree format.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ad Placeholder -->
        <div class="ad-container">
            <!-- Ad will be placed here -->
        </div>
    </main>

    <footer class="global-footer-container"></footer>

    <script src="js/logic.js" type="module"></script>
    <script>
        fetch('https://api.counterapi.dev/v1/projectut_com/visits/up')
            .then(response => response.json())
            .then(data => {
                const counter = document.getElementById('dynamic-visitor-count');
                if(counter) counter.textContent = data.count;
            })
            .catch(error => console.error('Error fetching visitor count:', error));
    </script>
    <script src="../../load-components.js"></script>
</body>
</html>
