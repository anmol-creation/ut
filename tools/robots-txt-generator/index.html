<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robots.txt Generator - Project UT</title>
    <meta name="description" content="Free online Robots.txt Generator. Create a properly formatted robots.txt file to control how search engines crawl your website.">
    <meta name="keywords" content="robots txt generator, create robots.txt, seo tool, web crawler rules, googlebot directives">
    <link rel="canonical" href="https://projectut.com/tools/robots-txt-generator/">

    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/tool.css">

    <link rel="manifest" href="manifest.json">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3565X5KNFD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3565X5KNFD');
    </script>
    <link rel="stylesheet" href="../../components/global-nav.css">
</head>
<body class="dark-theme">
    <header class="global-header-container"></header>

    <main class="container">
        <div class="tool-header">
            <h1>Robots.txt Generator</h1>
            <p>Generate a valid robots.txt file to guide search engine crawlers on your website.</p>
        </div>

        <div class="split-layout">
            <!-- Left Panel: Input Form -->
            <div class="panel input-panel">
                <div class="card">
                    <h2>Default Rules</h2>
                    <div class="form-group row-group">
                        <label for="default-access">Default Access for All Robots:</label>
                        <select id="default-access" class="select-input flex-grow">
                            <option value="allow">Allow All (Recommended)</option>
                            <option value="disallow">Disallow All (Hide Entire Site)</option>
                        </select>
                    </div>

                    <h2>Sitemap</h2>
                    <div class="form-group">
                        <label for="sitemap-url">Sitemap URL (Optional but Recommended):</label>
                        <input type="url" id="sitemap-url" placeholder="https://www.example.com/sitemap.xml" class="w-full">
                    </div>

                    <h2>Custom Directives</h2>
                    <div id="rules-container">
                        <!-- Dynamic rule rows will be added here -->
                    </div>

                    <button id="add-rule-btn" class="btn btn-secondary btn-small" style="margin-top: 10px;">+ Add Custom Rule</button>

                    <div class="button-group" style="margin-top: 2rem;">
                        <button id="generate-btn" class="btn btn-primary">Generate robots.txt</button>
                        <button id="clear-btn" class="btn btn-secondary">Reset</button>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Output Code -->
            <div class="panel output-panel">
                <div class="card h-full flex-col">
                    <div class="flex-between">
                        <h2>Generated Code</h2>
                        <div class="action-buttons">
                            <button id="copy-btn" class="btn btn-small">Copy Code</button>
                            <button id="download-btn" class="btn btn-small btn-outline">Download .txt</button>
                        </div>
                    </div>
                    <div class="code-container flex-grow">
                        <pre><code id="robot-code-output">User-agent: *
Disallow:

# Generated by Project UT</code></pre>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ad Placeholder -->
        <div class="ad-container">
            <!-- Ad will be placed here -->
        </div>
    </main>

    <footer class="global-footer-container"></footer>

    <script src="js/logic.js" type="module"></script>

    <script src="../../load-components.js"></script>
</body>
</html>
